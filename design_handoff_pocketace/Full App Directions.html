<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketAce — New Directions</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#111; }
@keyframes blink { 0%,100%{opacity:1} 49%{opacity:1} 50%,99%{opacity:0} }
@keyframes slide-up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const fmt = n => new Intl.NumberFormat('he-IL').format(Math.round(n));

/* ════════════════════════════════════════════════════════════
   DIRECTION 1 — קבלה / RECEIPT
   Looks like a thermal printer receipt. Cash register energy.
   No "app UI" at all — just a bill from the night.
   חשמלאי, שוק, corner store.
════════════════════════════════════════════════════════════ */

function DashedLine({ style={} }) {
  return <div style={{borderTop:'1px dashed rgba(0,0,0,0.25)',margin:'10px 0',...style}}/>;
}
function SolidLine({ style={} }) {
  return <div style={{borderTop:'2px solid #000',margin:'10px 0',...style}}/>;
}
function DoubleLine({ style={} }) {
  return <div style={{borderTop:'3px double #000',margin:'10px 0',...style}}/>;
}

function R1Auth() {
  const [email, setEmail] = useState('');
  return (
    <div style={{width:375,height:700,background:'#F5F0E8',overflow:'hidden',position:'relative',
      fontFamily:"'IBM Plex Mono',monospace",color:'#111'}}>
      {/* Receipt texture */}
      <div style={{position:'absolute',inset:0,opacity:0.03,
        backgroundImage:`repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,0.4) 27px,rgba(0,0,0,0.4) 28px)`,
        pointerEvents:'none'}}/>

      {/* Torn top edge */}
      <svg style={{position:'absolute',top:0,left:0,right:0,width:'100%'}} height="12" viewBox="0 0 375 12" preserveAspectRatio="none">
        <path d="M0,0 Q10,12 20,6 Q30,0 40,8 Q50,12 60,4 Q70,0 80,10 Q90,12 100,5 Q110,0 120,9 Q130,12 140,3 Q150,0 160,10 Q170,12 180,4 Q190,0 200,11 Q210,12 220,5 Q230,0 240,8 Q250,12 260,3 Q270,0 280,10 Q290,12 300,4 Q310,0 320,9 Q330,12 340,5 Q350,0 360,10 Q370,12 375,6 L375,0 Z" fill="#F5F0E8"/>
      </svg>

      <div style={{padding:'28px 24px 24px',display:'flex',flexDirection:'column',height:'100%'}}>
        {/* Header */}
        <div style={{textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:11,letterSpacing:'0.15em',textTransform:'uppercase',opacity:0.5,marginBottom:6}}>
            * * * * * * * * * * * * * *
          </div>
          <div style={{fontSize:34,fontWeight:700,letterSpacing:'-0.02em',lineHeight:1}}>POCKET ACE</div>
          <div style={{fontSize:11,letterSpacing:'0.12em',textTransform:'uppercase',marginTop:4,opacity:0.6}}>
            ניהול שולחן פוקר
          </div>
          <div style={{fontSize:11,letterSpacing:'0.15em',textTransform:'uppercase',opacity:0.5,marginTop:6}}>
            * * * * * * * * * * * * * *
          </div>
        </div>

        <DashedLine/>

        <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',gap:14}}>
          <div style={{fontSize:12,letterSpacing:'0.08em',textTransform:'uppercase',opacity:0.55,textAlign:'center',marginBottom:4}}>
            כניסה לחשבון
          </div>

          <div>
            <div style={{fontSize:11,opacity:0.5,marginBottom:5,letterSpacing:'0.06em'}}>אימייל:</div>
            <input value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="your@email.com" dir="ltr"
              style={{width:'100%',background:'transparent',border:'none',borderBottom:'2px solid #111',
                padding:'6px 0',fontFamily:"'IBM Plex Mono',monospace",fontSize:15,color:'#111',
                outline:'none',letterSpacing:'0.02em'}}/>
          </div>

          <DashedLine style={{margin:'4px 0'}}/>

          <button style={{
            width:'100%',padding:'14px',border:'2px solid #111',background:'#111',
            color:'#F5F0E8',fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,
            fontSize:16,cursor:'pointer',letterSpacing:'0.06em',textTransform:'uppercase',
          }}>
            כנס ←
          </button>

          <div style={{textAlign:'center',fontSize:11,opacity:0.45,letterSpacing:'0.06em',textTransform:'uppercase'}}>
            משתמש חדש? הרשם
          </div>
        </div>

        <DashedLine/>
        <div style={{textAlign:'center',fontSize:10,opacity:0.35,letterSpacing:'0.1em',textTransform:'uppercase'}}>
          תודה שבחרת PocketAce<br/>
          {new Date().toLocaleDateString('he-IL')}
        </div>
      </div>

      {/* Torn bottom edge */}
      <svg style={{position:'absolute',bottom:0,left:0,width:'100%'}} height="12" viewBox="0 0 375 12" preserveAspectRatio="none">
        <path d="M0,12 Q10,0 20,6 Q30,12 40,4 Q50,0 60,8 Q70,12 80,2 Q90,0 100,7 Q110,12 120,3 Q130,0 140,9 Q150,12 160,2 Q170,0 180,8 Q190,12 200,1 Q210,0 220,7 Q230,12 240,4 Q250,0 260,9 Q270,12 280,2 Q290,0 300,8 Q310,12 320,3 Q330,0 340,7 Q350,12 360,2 Q370,0 375,6 L375,12 Z" fill="#F5F0E8"/>
      </svg>
    </div>
  );
}

function R1Table() {
  const players = [
    {name:'יוסי',chips:580,buyIns:3},
    {name:'אבי',chips:200,buyIns:1},
    {name:'דנה',chips:120,buyIns:1},
    {name:'שלומי',chips:100,buyIns:1},
  ];
  return (
    <div style={{width:375,height:700,background:'#F5F0E8',overflow:'hidden',position:'relative',
      fontFamily:"'IBM Plex Mono',monospace",color:'#111'}}>
      <div style={{position:'absolute',inset:0,opacity:0.03,
        backgroundImage:`repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,0.4) 27px,rgba(0,0,0,0.4) 28px)`,
        pointerEvents:'none'}}/>
      <svg style={{position:'absolute',top:0,left:0,width:'100%'}} height="12" viewBox="0 0 375 12" preserveAspectRatio="none">
        <path d="M0,0 Q10,12 20,6 Q30,0 40,8 Q50,12 60,4 Q70,0 80,10 Q90,12 100,5 Q110,0 120,9 Q130,12 140,3 Q150,0 160,10 Q170,12 180,4 Q190,0 200,11 Q210,12 220,5 Q230,0 240,8 Q250,12 260,3 Q270,0 280,10 Q290,12 300,4 Q310,0 320,9 Q330,12 340,5 Q350,0 360,10 Q370,12 375,6 L375,0 Z" fill="#F5F0E8"/>
      </svg>

      <div style={{padding:'24px 22px',height:'100%',display:'flex',flexDirection:'column'}}>
        <div style={{textAlign:'center',marginBottom:8}}>
          <div style={{fontSize:10,letterSpacing:'0.18em',textTransform:'uppercase',opacity:0.4}}>* * RUNNING TAB * *</div>
          <div style={{fontSize:22,fontWeight:700,marginTop:4,letterSpacing:'-0.01em'}}>POCKET ACE</div>
        </div>

        <DashedLine/>

        <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:4,fontSize:11,opacity:0.5,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>
          <span>שחקן</span><span style={{textAlign:'left'}}>יתרה</span>
        </div>

        <SolidLine style={{margin:'0 0 8px'}}/>

        {players.map((p,i)=>(
          <div key={i}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'7px 0'}}>
              <div>
                <div style={{fontSize:16,fontWeight:700,letterSpacing:'-0.01em'}}>{p.name}</div>
                <div style={{fontSize:10,opacity:0.45,marginTop:2,textTransform:'uppercase',letterSpacing:'0.06em'}}>
                  {p.buyIns}× קנייה&nbsp;&nbsp;
                  <span style={{cursor:'pointer',borderBottom:'1px solid rgba(0,0,0,0.25)'}}>+ קנייה</span>
                </div>
              </div>
              <div style={{fontSize:22,fontWeight:700,textAlign:'left',letterSpacing:'-0.02em'}}>₪{fmt(p.chips)}</div>
            </div>
            {i < players.length-1 && <DashedLine style={{margin:'2px 0'}}/>}
          </div>
        ))}

        <SolidLine/>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
          <div>
            <div style={{fontSize:10,opacity:0.45,textTransform:'uppercase',letterSpacing:'0.08em'}}>סה"כ על השולחן</div>
            <div style={{fontSize:11,opacity:0.4,marginTop:2}}>זמן: 01:14:32</div>
          </div>
          <div style={{fontSize:28,fontWeight:700,letterSpacing:'-0.02em'}}>₪1,000</div>
        </div>

        <div style={{flex:1}}/>
        <DoubleLine/>
        <button style={{
          width:'100%',padding:'13px',border:'2px solid #111',background:'#111',
          color:'#F5F0E8',fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,
          fontSize:14,cursor:'pointer',letterSpacing:'0.06em',textTransform:'uppercase',
        }}>סגור שולחן</button>
      </div>
    </div>
  );
}

function R1Results() {
  const players = [{name:'יוסי',profit:380,buyIns:3},{name:'אבי',profit:120,buyIns:1},{name:'דנה',profit:-200,buyIns:1},{name:'שלומי',profit:-300,buyIns:2}];
  const debts = [{from:'דנה',to:'יוסי',amt:200},{from:'שלומי',to:'יוסי',amt:180}];
  return (
    <div style={{width:375,height:700,background:'#F5F0E8',overflow:'hidden',position:'relative',
      fontFamily:"'IBM Plex Mono',monospace",color:'#111'}}>
      <div style={{position:'absolute',inset:0,opacity:0.03,
        backgroundImage:`repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,0.4) 27px,rgba(0,0,0,0.4) 28px)`,
        pointerEvents:'none'}}/>
      <svg style={{position:'absolute',top:0,left:0,width:'100%'}} height="12" viewBox="0 0 375 12" preserveAspectRatio="none">
        <path d="M0,0 Q10,12 20,6 Q30,0 40,8 Q50,12 60,4 Q70,0 80,10 Q90,12 100,5 Q110,0 120,9 Q130,12 140,3 Q150,0 160,10 Q170,12 180,4 Q190,0 200,11 Q210,12 220,5 Q230,0 240,8 Q250,12 260,3 Q270,0 280,10 Q290,12 300,4 Q310,0 320,9 Q330,12 340,5 Q350,0 360,10 Q370,12 375,6 L375,0 Z" fill="#F5F0E8"/>
      </svg>

      <div style={{padding:'24px 22px',height:'100%',display:'flex',flexDirection:'column'}}>
        <div style={{textAlign:'center',marginBottom:8}}>
          <div style={{fontSize:10,letterSpacing:'0.18em',textTransform:'uppercase',opacity:0.4}}>* * סיכום לילה * *</div>
          <div style={{fontSize:22,fontWeight:700,marginTop:4}}>POCKET ACE</div>
          <div style={{fontSize:10,opacity:0.4,marginTop:3}}>24/04/26 &nbsp;|&nbsp; ₪1,000 על השולחן</div>
        </div>

        <SolidLine/>

        {players.map((p,i)=>(
          <div key={i}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0'}}>
              <div>
                <span style={{fontSize:16,fontWeight:700}}>{p.name}</span>
                <span style={{fontSize:10,opacity:0.4,marginRight:8,marginLeft:0}}>  ×{p.buyIns}</span>
                {i===0&&<span style={{fontSize:11,opacity:0.5}}> 🦈</span>}
              </div>
              <div style={{fontSize:20,fontWeight:700,
                textDecoration:p.profit<0?'none':'none',
              }}>
                <span style={{fontSize:13,opacity:0.6,marginLeft:2}}>{p.profit>0?'+ ':'- '}</span>
                {fmt(Math.abs(p.profit))}
              </div>
            </div>
            {i<players.length-1&&<DashedLine style={{margin:'2px 0'}}/>}
          </div>
        ))}

        <DoubleLine/>

        <div style={{fontSize:10,opacity:0.4,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>
          העברות לתשלום:
        </div>
        {debts.map((d,i)=>(
          <div key={i} style={{display:'flex',justifyContent:'space-between',
            padding:'6px 0',fontSize:13,borderBottom:i<debts.length-1?'1px dashed rgba(0,0,0,0.15)':'none'}}>
            <span style={{fontWeight:700}}>{d.from}</span>
            <span style={{opacity:0.4}}>→ ₪{d.amt} →</span>
            <span style={{fontWeight:700}}>{d.to}</span>
          </div>
        ))}

        <div style={{flex:1}}/>
        <DashedLine/>
        <div style={{textAlign:'center',fontSize:10,opacity:0.3,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:12}}>
          תודה על המשחק • נתראה שוב
        </div>
        <button style={{
          width:'100%',padding:'13px',border:'2px solid #111',background:'#111',
          color:'#F5F0E8',fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,
          fontSize:14,cursor:'pointer',letterSpacing:'0.06em',textTransform:'uppercase',
        }}>משחק נוסף →</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   DIRECTION 2 — DARK / HEAVY
   Pure black. Single white. One accent — deep clay red.
   Heebo 900. Full-bleed. No cards, no borders, no chrome.
   Just type and numbers. Like a live sports scoreboard.
════════════════════════════════════════════════════════════ */
const D = {
  bg: '#0A0A0A',
  clay: '#C44B30',
  clayD: 'rgba(196,75,48,0.18)',
  white: '#EFEFEF',
  dim: 'rgba(239,239,239,0.3)',
  dimmer: 'rgba(239,239,239,0.12)',
  green: '#28A060',
  font: "'Heebo', sans-serif",
  mono: "'IBM Plex Mono', monospace",
};

function D2Auth() {
  return (
    <div style={{width:375,height:700,background:D.bg,fontFamily:D.font,overflow:'hidden',position:'relative'}}>
      {/* Full-bleed ♠ */}
      <div style={{position:'absolute',left:'-40px',bottom:'-40px',
        fontSize:380,fontFamily:'serif',color:'rgba(255,255,255,0.025)',lineHeight:1,userSelect:'none',pointerEvents:'none'}}>♠</div>

      <div style={{position:'relative',zIndex:2,height:'100%',display:'flex',flexDirection:'column',padding:'44px 28px 36px'}}>
        {/* Tiny clay pill */}
        <div style={{display:'inline-flex',alignItems:'center',alignSelf:'flex-start',
          background:D.clay,borderRadius:4,padding:'4px 10px',marginBottom:28}}>
          <span style={{fontSize:10,fontWeight:700,color:'#fff',letterSpacing:'0.1em',textTransform:'uppercase'}}>POKER MANAGEMENT</span>
        </div>

        {/* Massive name */}
        <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}}>
          <div style={{fontSize:74,fontWeight:900,color:D.white,letterSpacing:'-0.05em',lineHeight:0.85,textTransform:'uppercase'}}>
            POCKET<br/>ACE
          </div>
          <div style={{marginTop:18,fontSize:14,color:D.dim,fontWeight:400,lineHeight:1.6}}>
            הכלי של החבר׳ה לניהול<br/>שולחן פוקר.
          </div>
        </div>

        {/* Bottom form — completely flat */}
        <div>
          <input placeholder="your@email.com" dir="ltr"
            style={{width:'100%',padding:'0 0 12px',background:'transparent',border:'none',
              borderBottom:`1px solid ${D.dimmer}`,color:D.white,fontFamily:D.mono,fontSize:16,
              outline:'none',marginBottom:16,letterSpacing:'0.02em'}}/>
          <button style={{
            width:'100%',padding:'17px',border:'none',borderRadius:0,
            background:D.clay,color:'#fff',
            fontFamily:D.font,fontWeight:900,fontSize:18,cursor:'pointer',
            textTransform:'uppercase',letterSpacing:'0.02em',
          }}>כנס</button>
          <div style={{marginTop:14,textAlign:'center',fontSize:12,color:D.dim}}>
            חדש? <span style={{color:D.clay,cursor:'pointer',fontWeight:700}}>הרשם</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function D2Table() {
  const players = [
    {name:'יוסי',chips:580,buyIns:3,lead:true},
    {name:'אבי',chips:200,buyIns:1},
    {name:'דנה',chips:120,buyIns:1},
    {name:'שלומי',chips:100,buyIns:1},
  ];
  return (
    <div style={{width:375,height:700,background:D.bg,fontFamily:D.font,overflow:'hidden',position:'relative'}}>
      {/* Scoreboard top */}
      <div style={{padding:'0 0 0',background:D.clay}}>
        <div style={{padding:'16px 24px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.6)',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:2}}>זמן</div>
            <div style={{fontFamily:D.mono,fontSize:28,fontWeight:700,color:'#fff'}}>01:14:32</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.6)',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:2}}>שולחן</div>
            <div style={{fontFamily:D.mono,fontSize:28,fontWeight:700,color:'#fff'}}>₪1,000</div>
          </div>
          <button style={{padding:'8px 14px',border:'1px solid rgba(255,255,255,0.4)',background:'transparent',
            color:'#fff',fontFamily:D.font,fontWeight:800,fontSize:12,cursor:'pointer',textTransform:'uppercase',letterSpacing:'0.04em'}}>
            סיום
          </button>
        </div>
      </div>

      {/* Player list — scoreboard style */}
      {players.map((p,i)=>(
        <div key={i} style={{
          padding:'16px 24px',
          borderBottom:`1px solid ${D.dimmer}`,
          background: p.lead?D.clayD:'transparent',
          display:'flex',alignItems:'center',gap:14,
        }}>
          <div style={{fontSize:18,fontFamily:D.mono,fontWeight:700,color:p.lead?D.clay:D.dimmer,
            width:20,flexShrink:0,textAlign:'center'}}>{i+1}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:20,fontWeight:900,color:p.lead?'#fff':D.white,
              letterSpacing:'-0.02em',textTransform:'uppercase'}}>{p.name}</div>
            <div style={{fontSize:11,color:D.dim,marginTop:1,fontFamily:D.mono}}>×{p.buyIns} קנייה</div>
          </div>
          <div style={{fontFamily:D.mono,fontSize:22,fontWeight:700,color:p.lead?D.clay:D.white}}>
            ₪{fmt(p.chips)}
          </div>
          <button style={{padding:'6px 12px',border:`1px solid ${D.dimmer}`,background:'transparent',
            color:D.dim,fontFamily:D.font,fontWeight:700,fontSize:11,cursor:'pointer',
            textTransform:'uppercase',letterSpacing:'0.04em'}}>+</button>
        </div>
      ))}
    </div>
  );
}

function D2Results() {
  const players = [
    {name:'יוסי',profit:380,top:true},
    {name:'אבי',profit:120},
    {name:'דנה',profit:-200},
    {name:'שלומי',profit:-300},
  ];
  return (
    <div style={{width:375,height:700,background:D.bg,fontFamily:D.font,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
      {/* Clay header */}
      <div style={{background:D.clay,padding:'20px 24px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontSize:22,fontWeight:900,color:'#fff',textTransform:'uppercase',letterSpacing:'-0.02em'}}>תוצאות</div>
        <div style={{fontFamily:D.mono,fontSize:15,fontWeight:700,color:'rgba(255,255,255,0.7)'}}>₪1,000</div>
      </div>

      {/* Rows */}
      <div style={{flex:1}}>
        {players.map((p,i)=>(
          <div key={i} style={{
            padding:'18px 24px',borderBottom:`1px solid ${D.dimmer}`,
            display:'flex',alignItems:'center',gap:14,
            animation:`slide-up 0.22s ${i*0.06}s both`,
          }}>
            <div style={{fontSize:32,fontFamily:'serif',color:p.top?D.clay:p.profit>0?D.green:D.dimmer,
              width:28,flexShrink:0,textAlign:'center',lineHeight:1}}>
              {p.top?'♠':p.profit>0?'♣':'♦'}
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:20,fontWeight:900,color:p.top?'#fff':D.white,
                textTransform:'uppercase',letterSpacing:'-0.02em'}}>{p.name}</div>
              <div style={{fontSize:11,color:D.dim,marginTop:1}}>
                {p.top?'כריש הלילה 🦈':p.profit>0?'מנצח':'🐟 שילם'}
              </div>
            </div>
            <div style={{fontFamily:D.mono,fontWeight:900,
              fontSize:p.top?32:24,
              color:p.top?D.clay:p.profit>0?D.green:'rgba(220,80,80,0.7)'}}>
              {p.profit>0?'+':'-'}{fmt(Math.abs(p.profit))}
            </div>
          </div>
        ))}

        {/* Debts */}
        <div style={{padding:'14px 24px',borderTop:`1px solid ${D.dimmer}`}}>
          <div style={{fontSize:10,color:D.dim,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>מי חייב למי</div>
          {[{from:'דנה',to:'יוסי',amt:200},{from:'שלומי',to:'יוסי',amt:180}].map((d,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
              padding:'9px 0',borderBottom:i===0?`1px solid ${D.dimmer}`:'none'}}>
              <span style={{fontWeight:800,fontSize:15,color:'rgba(220,80,80,0.8)',textTransform:'uppercase'}}>{d.from}</span>
              <span style={{fontFamily:D.mono,fontSize:14,color:D.dim}}>← ₪{d.amt} ←</span>
              <span style={{fontWeight:800,fontSize:15,color:D.green,textTransform:'uppercase'}}>{d.to}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{padding:'16px 24px',borderTop:`1px solid ${D.dimmer}`}}>
        <button style={{width:'100%',padding:'16px',border:'none',
          background:D.clay,color:'#fff',
          fontFamily:D.font,fontWeight:900,fontSize:17,cursor:'pointer',
          textTransform:'uppercase',letterSpacing:'0.02em'}}>
          משחק נוסף →
        </button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   DIRECTION 3 — WASHED / FADED
   Old film exposure. Washed-out beige/taupe mid-tones.
   No black, no white — everything is toned down.
   Single aged-green accent. Feels like a photo from 2008.
   Less polished = more real.
════════════════════════════════════════════════════════════ */
const W = {
  bg:    '#1C1814',
  bg2:   '#252018',
  bg3:   '#2E2820',
  paper: '#C8BEA8',
  dim:   'rgba(200,190,168,0.38)',
  dimmer:'rgba(200,190,168,0.12)',
  sage:  '#4A7A5A',
  sageL: '#5E9A70',
  sageD: 'rgba(74,122,90,0.16)',
  rust:  '#8A4A2A',
  rustL: '#A85A38',
  border:'rgba(200,190,168,0.08)',
  borderA:'rgba(200,190,168,0.2)',
  font:  "'Heebo', sans-serif",
  mono:  "'IBM Plex Mono', monospace",
};

function W3Auth() {
  return (
    <div style={{width:375,height:700,background:W.bg,fontFamily:W.font,overflow:'hidden',position:'relative'}}>
      <div style={{position:'absolute',inset:0,opacity:0.04,
        backgroundImage:`repeating-linear-gradient(45deg,rgba(200,190,168,0.3) 0px,rgba(200,190,168,0.3) 1px,transparent 1px,transparent 6px)`,
        pointerEvents:'none'}}/>

      <div style={{position:'relative',zIndex:2,height:'100%',display:'flex',flexDirection:'column',
        padding:'48px 28px 36px',justifyContent:'space-between'}}>
        <div>
          {/* Logo — handmade feel, slightly imperfect */}
          <div style={{display:'inline-block',border:`1px solid ${W.paper}`,padding:'3px 10px',
            borderRadius:2,marginBottom:20,opacity:0.5}}>
            <span style={{fontSize:10,letterSpacing:'0.15em',color:W.paper,textTransform:'uppercase'}}>pocket ace</span>
          </div>
          <div style={{fontSize:56,fontWeight:900,color:W.paper,lineHeight:0.88,letterSpacing:'-0.04em'}}>
            שולחן<br/>
            <span style={{color:W.sageL}}>פוקר</span>
          </div>
          <div style={{marginTop:12,fontSize:13,color:W.dim,fontWeight:400,lineHeight:1.7}}>
            לנהל את הלילה,<br/>בלי עיגולים ובלי חישובים.
          </div>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <input placeholder="your@email.com" dir="ltr"
            style={{width:'100%',padding:'13px 14px',background:W.bg3,
              border:`1px solid ${W.borderA}`,borderRadius:6,
              color:W.paper,fontFamily:W.mono,fontSize:14,outline:'none'}}/>
          <button style={{
            width:'100%',padding:'15px',border:'none',borderRadius:6,
            background:W.sage,color:'rgba(255,255,255,0.9)',
            fontFamily:W.font,fontWeight:800,fontSize:16,cursor:'pointer',
            letterSpacing:'-0.01em',
          }}>כנס ♠</button>
          <div style={{textAlign:'center',fontSize:12,color:W.dim,marginTop:2}}>
            עדיין אין לך? <span style={{color:W.sageL,cursor:'pointer'}}>הרשם</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function W3Table() {
  const players = [
    {name:'יוסי',chips:580,buyIns:3,up:true},
    {name:'אבי',chips:200,buyIns:1},
    {name:'דנה',chips:120,buyIns:1},
    {name:'שלומי',chips:100,buyIns:1},
  ];
  return (
    <div style={{width:375,height:700,background:W.bg,fontFamily:W.font,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
      <div style={{position:'absolute',inset:0,opacity:0.04,
        backgroundImage:`repeating-linear-gradient(45deg,rgba(200,190,168,0.3) 0px,rgba(200,190,168,0.3) 1px,transparent 1px,transparent 6px)`,
        pointerEvents:'none'}}/>

      {/* Minimal header */}
      <div style={{padding:'20px 22px 16px',borderBottom:`1px solid ${W.border}`,
        display:'flex',justifyContent:'space-between',alignItems:'flex-end',position:'relative',zIndex:2}}>
        <div>
          <div style={{fontSize:11,color:W.dim,marginBottom:3,letterSpacing:'0.06em'}}>זמן משחק</div>
          <div style={{fontFamily:W.mono,fontSize:30,fontWeight:700,color:W.sageL,letterSpacing:'0.02em'}}>01:14:32</div>
        </div>
        <div style={{textAlign:'left'}}>
          <div style={{fontSize:11,color:W.dim,marginBottom:3,letterSpacing:'0.06em'}}>על השולחן</div>
          <div style={{fontFamily:W.mono,fontSize:24,fontWeight:700,color:W.paper}}>₪1,000</div>
        </div>
      </div>

      {/* Players */}
      <div style={{flex:1,position:'relative',zIndex:2}}>
        {players.map((p,i)=>(
          <div key={i} style={{
            padding:'15px 22px',
            borderBottom:`1px solid ${W.border}`,
            display:'flex',alignItems:'center',gap:12,
            background: p.up?W.sageD:'transparent',
          }}>
            <div style={{fontFamily:W.mono,fontSize:20,color:p.up?W.sageL:W.dim,
              width:20,flexShrink:0,textAlign:'center',fontWeight:600}}>{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:18,fontWeight:800,color:p.up?W.paper:W.paper,letterSpacing:'-0.01em'}}>{p.name}</div>
              <div style={{fontSize:11,color:W.dim,marginTop:1,fontFamily:W.mono}}>קנה ×{p.buyIns}</div>
            </div>
            <div style={{fontFamily:W.mono,fontSize:20,fontWeight:700,color:p.up?W.sageL:W.paper}}>₪{fmt(p.chips)}</div>
            <button style={{padding:'6px 11px',border:`1px solid ${W.borderA}`,borderRadius:4,
              background:'transparent',color:W.dim,fontFamily:W.font,fontWeight:700,
              fontSize:11,cursor:'pointer'}}>+ קנייה</button>
          </div>
        ))}
      </div>

      <div style={{padding:'14px 22px',borderTop:`1px solid ${W.border}`,position:'relative',zIndex:2}}>
        <button style={{width:'100%',padding:'14px',border:`1px solid rgba(138,74,42,0.4)`,borderRadius:6,
          background:'rgba(138,74,42,0.12)',color:W.rustL,
          fontFamily:W.font,fontWeight:800,fontSize:15,cursor:'pointer'}}>סיים משחק</button>
      </div>
    </div>
  );
}

function W3Results() {
  const players = [{name:'יוסי',profit:380,top:true},{name:'אבי',profit:120},{name:'דנה',profit:-200},{name:'שלומי',profit:-300}];
  return (
    <div style={{width:375,height:700,background:W.bg,fontFamily:W.font,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
      <div style={{position:'absolute',inset:0,opacity:0.04,
        backgroundImage:`repeating-linear-gradient(45deg,rgba(200,190,168,0.3) 0px,rgba(200,190,168,0.3) 1px,transparent 1px,transparent 6px)`,
        pointerEvents:'none'}}/>

      <div style={{padding:'20px 22px 14px',borderBottom:`1px solid ${W.border}`,
        display:'flex',justifyContent:'space-between',alignItems:'center',position:'relative',zIndex:2}}>
        <div style={{fontSize:22,fontWeight:900,color:W.paper,letterSpacing:'-0.02em'}}>סוף הלילה</div>
        <div style={{fontFamily:W.mono,fontSize:14,color:W.dim}}>₪1,000</div>
      </div>

      <div style={{flex:1,position:'relative',zIndex:2}}>
        {players.map((p,i)=>(
          <div key={i} style={{
            padding:'15px 22px',borderBottom:`1px solid ${W.border}`,
            display:'flex',alignItems:'center',gap:12,
            background:p.top?W.sageD:'transparent',
            animation:`slide-up 0.22s ${i*0.06}s both`,
          }}>
            <div style={{flex:1}}>
              <div style={{fontSize:18,fontWeight:800,color:p.top?W.paper:W.paper,letterSpacing:'-0.01em'}}>{p.name}</div>
              <div style={{fontSize:11,color:W.dim,marginTop:1}}>
                {p.top?'🦈 כריש':p.profit>0?'פלוס':'מינוס'}
              </div>
            </div>
            <div style={{fontFamily:W.mono,fontWeight:900,fontSize:p.top?28:22,
              color:p.top?W.sageL:p.profit>0?W.sageL:W.rustL}}>
              {p.profit>0?'+':''}{fmt(p.profit)}
            </div>
          </div>
        ))}

        <div style={{padding:'14px 22px',position:'relative',zIndex:2}}>
          <div style={{fontSize:10,color:W.dim,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>העברות</div>
          {[{from:'דנה',to:'יוסי',amt:200},{from:'שלומי',to:'יוסי',amt:180}].map((d,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',
              borderBottom:i===0?`1px solid ${W.border}`:'none',fontSize:14}}>
              <span style={{fontWeight:700,color:W.rustL}}>{d.from}</span>
              <span style={{fontFamily:W.mono,color:W.dim}}>₪{d.amt}</span>
              <span style={{fontWeight:700,color:W.sageL}}>{d.to}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{padding:'14px 22px',borderTop:`1px solid ${W.border}`,position:'relative',zIndex:2}}>
        <button style={{width:'100%',padding:'14px',border:'none',borderRadius:6,
          background:W.sage,color:'rgba(255,255,255,0.9)',
          fontFamily:W.font,fontWeight:800,fontSize:16,cursor:'pointer'}}>♠ עוד סיבוב</button>
      </div>
    </div>
  );
}

/* ════════════ CANVAS ════════════ */
function App() {
  return (
    <DesignCanvas title="PocketAce — Hood Directions II">
      <DCSection id="receipt" title="1 — קבלה   •   Thermal receipt print   •   שוק / כספומט energy">
        <DCArtboard id="r-auth"  label="Auth"       width={375} height={700}><R1Auth/></DCArtboard>
        <DCArtboard id="r-table" label="Game Table" width={375} height={700}><R1Table/></DCArtboard>
        <DCArtboard id="r-res"   label="Results"    width={375} height={700}><R1Results/></DCArtboard>
      </DCSection>
      <DCSection id="dark" title="2 — כבד   •   Full black + clay red   •   Sports scoreboard energy">
        <DCArtboard id="d-auth"  label="Auth"       width={375} height={700}><D2Auth/></DCArtboard>
        <DCArtboard id="d-table" label="Game Table" width={375} height={700}><D2Table/></DCArtboard>
        <DCArtboard id="d-res"   label="Results"    width={375} height={700}><D2Results/></DCArtboard>
      </DCSection>
      <DCSection id="washed" title="3 — דהוי   •   Washed dark + sage green   •   Faded film, lowkey">
        <DCArtboard id="w-auth"  label="Auth"       width={375} height={700}><W3Auth/></DCArtboard>
        <DCArtboard id="w-table" label="Game Table" width={375} height={700}><W3Table/></DCArtboard>
        <DCArtboard id="w-res"   label="Results"    width={375} height={700}><W3Results/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
