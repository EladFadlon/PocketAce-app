<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background — no rounded corners so iOS doesn't show white edges -->
  <rect width="512" height="512" fill="#1A1614"/>

  <!-- Back card — rotated left, centred in safe zone -->
  <g transform="rotate(-12, 256, 300)">
    <rect x="76" y="94" width="256" height="340" rx="32" fill="#272118" stroke="rgba(200,190,168,0.15)" stroke-width="6"/>
    <rect x="94" y="112" width="220" height="306" rx="24" fill="#2E2820"/>
    <line x1="94" y1="163" x2="314" y2="163" stroke="rgba(200,190,168,0.06)" stroke-width="4"/>
    <line x1="94" y1="214" x2="314" y2="214" stroke="rgba(200,190,168,0.06)" stroke-width="4"/>
    <line x1="94" y1="265" x2="314" y2="265" stroke="rgba(200,190,168,0.06)" stroke-width="4"/>
    <line x1="94" y1="316" x2="314" y2="316" stroke="rgba(200,190,168,0.06)" stroke-width="4"/>
    <line x1="94" y1="367" x2="314" y2="367" stroke="rgba(200,190,168,0.06)" stroke-width="4"/>
  </g>

  <!-- Front card — ace of spades — rotated right -->
  <g transform="rotate(8, 256, 300)">
    <rect x="128" y="78" width="264" height="356" rx="32" fill="#201C18" stroke="rgba(200,190,168,0.22)" stroke-width="6"/>
    <!-- Sage accent stripe -->
    <rect x="128" y="78" width="264" height="12" rx="6" fill="#4A7A5A"/>
    <!-- Top-left corner label -->
    <text x="158" y="148" font-family="Georgia,serif" font-size="56" font-weight="700" fill="#C8BEA8" text-anchor="middle">A</text>
    <text x="158" y="192" font-family="Georgia,serif" font-size="38" fill="#C8BEA8" text-anchor="middle">&#9824;</text>
    <!-- Centre big spade -->
    <text x="260" y="318" font-family="Georgia,serif" font-size="152" fill="#C8BEA8" text-anchor="middle">&#9824;</text>
    <!-- Bottom-right corner label (rotated 180°) -->
    <g transform="rotate(180, 358, 370)">
      <text x="358" y="342" font-family="Georgia,serif" font-size="56" font-weight="700" fill="#C8BEA8" text-anchor="middle">A</text>
      <text x="358" y="386" font-family="Georgia,serif" font-size="38" fill="#C8BEA8" text-anchor="middle">&#9824;</text>
    </g>
  </g>
</svg>
