<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Full-bleed background — no transparency, no rounded corners -->
  <rect width="512" height="512" fill="#1A1614"/>

  <!-- Sage ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#4A7A5A" stroke-width="28"/>

  <!-- Inner fill -->
  <circle cx="256" cy="256" r="206" fill="#1A1614"/>

  <!--
    Spade glyph — proper ♠ shape:
    • Pointed top at (256, 148)
    • Two round lobes reaching out to x≈150 and x≈362 at mid-height
    • Inner concave indent where lobes meet
    • Narrow stem that fans out to a flat base at y=372
    Centred at (256, 260) inside the ring.
  -->
  <path d="
    M 256,148

    C 256,148 148,212 148,268
    C 148,306 172,322 200,316

    C 186,344 168,358 144,366
    L 200,366
    C 210,374 230,382 256,382
    C 282,382 302,374 312,366
    L 368,366
    C 344,358 326,344 312,316

    C 340,322 364,306 364,268
    C 364,212 256,148 256,148
    Z
  " fill="#C8BEA8"/>

</svg>
